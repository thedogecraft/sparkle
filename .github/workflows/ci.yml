name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build:vite

      - name: Build unpacked app
        run: pnpm exec electron-builder --dir

      - name: Smoke test
        run: pnpm test:smoke
